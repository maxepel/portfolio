name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site (demos/ only, without work-in-progress files)
        run: |
          mkdir _site
          cp -r demos/. _site/
          touch _site/.nojekyll
          # Not part of the public page: design mockups and the logo source archive.
          rm -rf _site/mockups
          rm -f _site/film-archive.html   # unlinked page with a link outside the site
          rm -f _site/assets/logos/pencil-transparent-logos.zip
          # The Disney game ships as GitHub Release files, never inside the site.
          rm -rf _site/disney-download
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
